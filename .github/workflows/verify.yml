name: verify

# The security invariants are the project's central claim. This workflow makes
# them a gate rather than an assertion: if any invariant regresses, the build
# goes red and the claim is falsified automatically.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Select SQLite target and generate Prisma client
        run: |
          npm run db:use:sqlite --workspace=@agentbridge/api
          npx prisma generate
        working-directory: apps/api

      # Apps consume the packages' COMPILED output, so these must exist before
      # typecheck or build. npm does not guarantee workspace ordering.
      - name: Build workspace packages
        run: npm run build:packages

      - name: Apply migrations
        run: npx prisma migrate deploy
        working-directory: apps/api
        env:
          DATABASE_URL: file:./ci.db

      - name: Typecheck (api, mcp, web)
        run: npm run typecheck

      # The suite provisions its own database and generates its own agent keys,
      # so no secrets are needed. Config validation supplies ephemeral values in
      # non-production, which is exactly the behaviour being relied on here.
      - name: Security invariants and adversarial suite
        run: npm test

      - name: Build API and MCP
        run: npm run build

      - name: Build dashboard
        run: npm run build:web

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # `npm audit --omit=dev` does not reliably exclude a WORKSPACE package's
      # devDependencies, so it failed on the Prisma CLI's transitive advisory —
      # a package that never ships. This gate fails on any high or critical
      # advisory that is NOT explicitly accepted in the script, so a new one
      # still breaks the build.
      - name: Audit dependencies
        run: node scripts/audit-check.mjs

  # Separate job on purpose. The image is what ships and deserves a gate, but a
  # Dockerfile problem should not mask the test results — the two failures have
  # different causes and different fixes.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t agentbridge-api:ci .
      - name: Verify the image starts and reports ready
        run: |
          docker run -d --name api-smoke -p 3001:3001             -e NODE_ENV=development             -e DATABASE_URL="file:./smoke.db"             -e ENABLE_DEMO_ROUTES=false             -e LOG_LEVEL=warn             agentbridge-api:ci || true
          # The image targets Postgres, so a SQLite URL will not migrate. What
          # this asserts is narrower and still worth asserting: the image was
          # built, the entrypoint resolves, and node can load the compiled
          # output — which is exactly the class of failure that shipped a build
          # pointing `main` at TypeScript source.
          sleep 8
          docker logs api-smoke 2>&1 | tail -20
          docker rm -f api-smoke >/dev/null 2>&1 || true
