# ============================================
# Render Blueprint — AgentBridge API
# ============================================
# Render reads this file and configures the service automatically, which avoids
# the manual build settings that are easy to get wrong on a monorepo.
#
# Deploy: render.com -> New -> Blueprint -> connect this repo -> Apply.
#
# Only DATABASE_URL needs entering by hand; the three secrets are generated by
# Render itself and never leave the dashboard.

services:
  - type: web
    name: agentbridge-api
    runtime: docker
    plan: free
    region: singapore
    # Repo root, NOT apps/api. The Dockerfile needs the workspace packages and
    # the lockfile, so a rootDir scoped to the app cannot build.
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Returns 503 until the database actually answers, so a green health check
    # means the service genuinely works rather than merely having started.
    healthCheckPath: /api/ready

    envVars:
      # Deliberate. `development` is what permits the sandbox payment provider
      # and the demo routes — the config loader hard-refuses both under
      # `production`, because neither belongs in a real deployment.
      - key: NODE_ENV
        value: development

      # Paste the Neon connection string here (Render dashboard -> Environment).
      - key: DATABASE_URL
        sync: false

      # Generated by Render. Never seen by anyone, never in git.
      - key: SESSION_SECRET
        generateValue: true
      - key: RAZORPAY_KEY_SECRET
        generateValue: true
      - key: RAZORPAY_WEBHOOK_SECRET
        generateValue: true

      - key: PAYMENT_MODE
        value: sandbox
      - key: RAZORPAY_KEY_ID
        value: rzp_test_sandbox
      - key: ENABLE_DEMO_ROUTES
        value: "true"
      - key: LOG_LEVEL
        value: info

      # Set to the Vercel dashboard URL after that deploy exists. Until then the
      # dashboard's browser requests are refused by CORS.
      - key: ALLOWED_ORIGINS
        sync: false

      # NOT SET ON PURPOSE: API_HOST and API_PORT.
      # Render injects PORT, and the server then binds 0.0.0.0 by itself. An
      # explicit API_HOST=127.0.0.1 binds loopback inside the container and the
      # platform returns 502 — which is exactly how the Railway attempt failed.
